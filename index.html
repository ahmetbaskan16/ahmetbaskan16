<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ruh Haline Göre Öneri</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <div>
          <p class="eyebrow">MoodFlix</p>
          <h1>Ruh haline göre film & dizi önerileri</h1>
          <p class="subtitle">
            Bir ruh hali seç, tek tıkla sana uygun 3–5 öneri gelsin.
          </p>
        </div>
        <button class="mode-toggle" id="modeToggle" type="button">
          🌙 Karanlık Mod
        </button>
      </header>

      <section class="controls">
        <label class="field">
          <span>Ruh hali</span>
          <select id="moodSelect">
            <option value="Mutlu">Mutlu</option>
            <option value="Üzgün">Üzgün</option>
            <option value="Stresli">Stresli</option>
            <option value="Romantik">Romantik</option>
            <option value="Aksiyon Modu">Aksiyon Modu</option>
          </select>
        </label>

        <div class="button-group">
          <button class="primary" id="recommendBtn" type="button">Öner</button>
          <button class="ghost" id="refreshBtn" type="button">
            Bunu beğenmedim
          </button>
        </div>
      </section>

      <section class="results" id="results" aria-live="polite"></section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
